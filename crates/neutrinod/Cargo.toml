[package]
name = "neutrinod"
description = "Neutrino's daemon"
version.workspace = true
edition.workspace = true

[dependencies]
neutrino-proto.workspace = true
neutrino-git.workspace = true
neutrino-remote.workspace = true
neutrino-store.workspace = true
neutrino-ci.workspace = true
neutrino-vault.workspace = true
sha2 = "0.10"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["process"] }
notify = "8"

[dev-dependencies]
base64 = "0.22"
neutrino-vault.workspace = true
tempfile.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
