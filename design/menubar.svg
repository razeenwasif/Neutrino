<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- Neutrino menu bar glyph, 18 pt, drawn as a template (macOS tints it).
       The app icon reduced to strokes: the main track, the branch that leaves
       it and merges back, and the particle at the top of the branch. Faint
       parts are partial opacity so the particle reads first. The particle
       sits at the branch's apex rather than where the app icon has it, so it
       clears the merge ring at this size. MenuBarIcon.swift draws the same
       shapes; keep the two in step. -->
  <g transform="translate(0.6 0.6)">
    <g fill="none" stroke="#000" stroke-linecap="round">
      <!-- main track -->
      <path d="M3 15 L15 3" stroke-width="1.5" stroke-opacity="0.45"/>
      <!-- branch, the part the particle hasn't reached -->
      <path d="M6.64 6.64 C7.985 5.2975 10.115 4.74 12.1 5.9" stroke-width="1.5" stroke-opacity="0.45"/>
      <!-- trail, fork to particle -->
      <path d="M5.9 12.1 C4.74 10.115 5.2975 7.985 6.64 6.64" stroke-width="1.6"/>
    </g>
    <!-- fork and merge commits: rings punched out of the tracks -->
    <circle cx="5.9" cy="12.1" r="1.6" fill="#fff"/>
    <circle cx="12.1" cy="5.9" r="1.6" fill="#fff"/>
    <circle cx="5.9" cy="12.1" r="1.35" fill="none" stroke="#000" stroke-width="1.1"/>
    <circle cx="12.1" cy="5.9" r="1.35" fill="none" stroke="#000" stroke-width="1.1"/>
    <!-- particle -->
    <circle cx="6.64" cy="6.64" r="1.95" fill="#000"/>
  </g>
</svg>
