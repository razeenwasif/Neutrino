name: Neutrino
options:
  bundleIdPrefix: dev.neutrino
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  NeutrinoKit:
    path: NeutrinoKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  NeutrinoMac:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: NeutrinoKit
      - target: NeutrinoWidgetMac
        embed: true
    info:
      path: Mac/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Neutrino looks for your Neutrino server on the local network so you can pair with it.
        NSBonjourServices: [_neutrino._tcp]
        CFBundleURLTypes:
          - CFBundleURLName: dev.neutrino.url
            CFBundleURLSchemes: [neutrino]
    settings:
      base:
        PRODUCT_NAME: Neutrino
        PRODUCT_BUNDLE_IDENTIFIER: dev.neutrino.mac
        CODE_SIGN_ENTITLEMENTS: Mac/Neutrino.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The app talks to neutrinod's Unix socket in ~/.neutrino, which a
        # sandboxed app can't reach.
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_CFBundleDisplayName: Neutrino
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Debug:
          # A stable signature, so the Keychain remembers that this app may
          # read the server token instead of asking after every rebuild.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: YOUR_TEAM_ID

  NeutrinoWidgetMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget/NeutrinoWidget.swift
    dependencies:
      - package: NeutrinoKit
    info:
      path: Widget/Info-macOS.plist
      properties:
        CFBundleDisplayName: Neutrino Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: NeutrinoWidgetMac
        PRODUCT_BUNDLE_IDENTIFIER: dev.neutrino.mac.widget
        CODE_SIGN_ENTITLEMENTS: Widget/NeutrinoWidgetMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YOUR_TEAM_ID

  NeutrinoIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [iOS]
    dependencies:
      - package: NeutrinoKit
      - target: NeutrinoNotify
      - target: NeutrinoWidgetIOS
        embed: true
    info:
      path: iOS/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Neutrino looks for your Neutrino server on the local network so you can pair with it.
        NSBonjourServices: [_neutrino._tcp]
        NSFaceIDUsageDescription: Face ID confirms merges, approvals and cancels before they're signed and sent to your server.
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: iOS/Neutrino.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.dev.neutrino]
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.neutrino.shared"]
    settings:
      base:
        PRODUCT_NAME: Neutrino
        PRODUCT_BUNDLE_IDENTIFIER: dev.neutrino.ios
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Neutrino
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  NeutrinoNotify:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [iOSNotify]
    dependencies:
      - package: NeutrinoKit
    info:
      path: iOSNotify/Info.plist
      properties:
        CFBundleDisplayName: Neutrino Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: iOSNotify/NeutrinoNotify.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.neutrino]
        keychain-access-groups: ["$(AppIdentifierPrefix)dev.neutrino.shared"]
    settings:
      base:
        PRODUCT_NAME: NeutrinoNotify
        PRODUCT_BUNDLE_IDENTIFIER: dev.neutrino.ios.notify
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  NeutrinoWidgetIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Widget/NeutrinoWidget.swift
    dependencies:
      - package: NeutrinoKit
    info:
      path: Widget/Info-iOS.plist
      properties:
        CFBundleDisplayName: Neutrino Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: NeutrinoWidgetIOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.neutrino.ios.widget
        CODE_SIGN_ENTITLEMENTS: Widget/NeutrinoWidgetIOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

schemes:
  NeutrinoIOS:
    build:
      targets:
        NeutrinoIOS: all
        NeutrinoWidgetIOS: all
    run:
      config: Debug
  NeutrinoMac:
    build:
      targets:
        NeutrinoMac: all
        NeutrinoWidgetMac: all
    run:
      config: Debug
