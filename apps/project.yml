name: Neutrino
options:
  bundleIdPrefix: dev.neutrino
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  NeutrinoKit:
    path: NeutrinoKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  NeutrinoMac:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: NeutrinoKit
    info:
      path: Mac/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Neutrino looks for your Neutrino server on the local network so you can pair with it.
        NSBonjourServices: [_neutrino._tcp]
    settings:
      base:
        PRODUCT_NAME: Neutrino
        PRODUCT_BUNDLE_IDENTIFIER: dev.neutrino.mac
        CODE_SIGN_ENTITLEMENTS: Mac/Neutrino.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The app talks to neutrinod's Unix socket in ~/.neutrino, which a
        # sandboxed app can't reach.
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_CFBundleDisplayName: Neutrino
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"

schemes:
  NeutrinoMac:
    build:
      targets: { NeutrinoMac: all }
    run:
      config: Debug
