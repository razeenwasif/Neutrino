[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
neutrino-proto = { path = "crates/neutrino-proto" }
neutrino-diff = { path = "crates/neutrino-diff" }
neutrino-git = { path = "crates/neutrino-git" }
neutrino-remote = { path = "crates/neutrino-remote" }
neutrino-store = { path = "crates/neutrino-store" }
neutrino-ci = { path = "crates/neutrino-ci" }
neutrino-vault = { path = "crates/neutrino-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "fs", "time"] }
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
